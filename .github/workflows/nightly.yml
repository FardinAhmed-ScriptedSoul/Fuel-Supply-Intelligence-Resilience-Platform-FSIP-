name: nightly

on:
  schedule:
    - cron: "0 20 * * *"   # 20:00 UTC daily (02:00 Asia/Dhaka)
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: backend:backend/shared:intel/predictor

jobs:
  evidence:
    name: acceptance, load, bake-off
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt -r requirements-ci.txt
      - name: Start stack
        run: |
          cp .env.example .env
          docker compose up -d --build --wait --wait-timeout 300
      - name: Acceptance scenarios (brief scenarios, deterministic via /admin/step)
        run: |
          if [ -d tests/acceptance ]; then
            mkdir -p results
            pytest tests/acceptance -q --junitxml=results/acceptance.xml
          else
            echo "tests/acceptance not present yet (see backlog F-007)"
          fi
      - name: Load test (k6)
        run: |
          if [ -f deploy/k6/load.js ]; then
            mkdir -p results
            docker run --rm --network host -v "$PWD/deploy/k6:/scripts" -v "$PWD/results:/results" \
              grafana/k6 run --summary-export=/results/k6-summary.json /scripts/load.js
          else
            echo "deploy/k6/load.js not present yet (see backlog F-011)"
          fi
      - name: Policy bake-off (second simulator instance, same seed)
        run: |
          if [ -f scripts/bakeoff.py ]; then
            mkdir -p results
            python scripts/bakeoff.py --out results/bakeoff.json
          else
            echo "scripts/bakeoff.py not present yet (see backlog F-009)"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ github.run_id }}
          path: results/
          if-no-files-found: ignore
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=300
      - name: Tear down
        if: always()
        run: docker compose down -v
