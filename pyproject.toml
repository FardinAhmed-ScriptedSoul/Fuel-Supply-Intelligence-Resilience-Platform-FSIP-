[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
pythonpath = [".", "backend", "backend/shared", "intel/predictor"]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "db: tests that require a live postgres database",
    "sim: tests that require the live simulator",
    "acceptance: business scenario acceptance tests",
    "slow: slow running test cases",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "setup",
    "scripts",
    "starter-kit",
    "docs",
    "deploy",
    "loadtest",
    "web",
    "code",
    "reference",
]
src = [
    "backend/shared",
    "backend/api",
    "backend/worker",
    "intel/predictor",
    "tests",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
extend-ignore = ["UP007", "E501", "B905", "B904", "UP017", "I001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
