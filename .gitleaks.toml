title = "fuel-platform gitleaks config"
[extend]
useDefault = true

[allowlist]
description = "Placeholders and local-only demo values"
paths = [
  '''tests/.*''',
  '''docs/.*''',
  '''setup/.*''',
  '''starter-kit/.*''',
  '''deploy/.*''',
  '''reports/.*''',
  '''planning/.*''',
  '''\.github/.*''',
  '''\.env\.example''',
  '''docker-compose.*''',
]
regexes = [
  '''ci-only-password''',
  '''fuel-local''',
  '''local-demo-only''',
  '''demo-secret''',
  '''tok-fardin-99''',
  '''tok-ops-77''',
  '''secret-token-123''',
]
