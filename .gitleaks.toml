title = "fuel-platform gitleaks config"
[extend]
useDefault = true

[allowlist]
description = "Placeholders and local-only demo values"
paths = [
  '''\.env\.example$''',
  '''\.gitleaks\.toml$''',
  '''docker-compose\.ya?ml$''',
  '''docs/''',
  '''setup/''',
  '''starter-kit/''',
  '''deploy/''',
  '''\.github/''',
  '''tests/''',
  '''reports/''',
  '''planning/''',
]
stopwords = [
  "fuel-local",
  "ci-only-password",
  "local-demo-only",
  "demo-secret",
]
