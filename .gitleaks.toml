title = "fuel-platform gitleaks config"
[extend]
useDefault = true

[allowlist]
description = "Placeholders and local-only demo values"
paths = [
  '''(?i)tests/''',
  '''(?i)docs/''',
  '''(?i)setup/''',
  '''(?i)starter-kit/''',
  '''(?i)deploy/''',
  '''(?i)reports/''',
  '''(?i)planning/''',
  '''(?i)\.github/''',
  '''(?i)\.env\.example''',
  '''(?i)docker-compose''',
]
stopwords = [
  "fuel-local",
  "ci-only-password",
  "local-demo-only",
  "demo-secret",
  "tok-fardin-99",
  "tok-ops-77",
  "secret-token-123",
]
